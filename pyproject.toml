[project]
name = "graph-builder"
version = "0.1.0"
description = "A modular knowledge graph pipeline for entity and relationship extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain-text-splitters>=0.3",
    "spacy>=3.7",
    "networkx>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "instructor>=1.0"]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_builder"]
